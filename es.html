      // GitHub Pages: o 404.html manda qualquer rota para a raiz com o caminho em "?/...".
      // Aqui ele volta para a URL real — e o diretório desta carga (sempre a raiz do site)
      // fica em __BASE_PATH, a base de todos os caminhos relativos do app.
      (function () {
        var l = window.location;
        window.__BASE_PATH = l.pathname.replace(/[^/]*$/, '');
        if (l.search.charAt(1) === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', window.__BASE_PATH.replace(/\/$/, '') + decoded + l.hash);
        }
      })();
